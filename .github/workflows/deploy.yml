name: Redirect legacy Pages URL to nebulalab.app

# The documentation site itself is built and served by Cloudflare Pages at
# https://nebulalab.app/. GitHub Pages keeps serving a redirect shell only, because
# already-released app builds have https://tshygo.github.io/NebulaLab-Docs/ baked in
# and GitHub's own custom-domain redirect is not available under this setup.

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy redirect shell
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
